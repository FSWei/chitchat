[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chitchat"
version = "1.0.0"
description = "Make an LLM's output read like a human chat: bubbles, dedup, banned words, optional context injection."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Feng Shiwei" }]
keywords = ["llm", "chatbot", "bubbles", "hermes", "plugin"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/FSWei/chitchat"

[tool.setuptools.packages.find]
include = ["chitchat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
