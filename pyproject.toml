[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chitchat"
version = "1.1.0"
description = "A character skeleton for agents: her own days, photos and memory, and a chat style that reads human."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Feng Shiwei" }]
keywords = ["llm", "chatbot", "bubbles", "hermes", "plugin"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  # Windows 上没有系统 tzdata，zoneinfo 需要这个包才能解析 Asia/Shanghai 之类的时区
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/FSWei/chitchat"

[tool.setuptools.packages.find]
include = ["chitchat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
