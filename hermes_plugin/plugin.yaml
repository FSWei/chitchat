name: chitchat
version: 1.0.0
description: >-
  Chat-style output shaping: split replies into bubbles, strip markdown, dedupe
  repetition, filter banned words, and optionally inject time / mood / persona
  context. Scoped to configured chats; failure = passthrough.
author: FSWei
provides_hooks:
  - transform_llm_output
  - pre_llm_call
  - pre_tool_call
provides_commands:
  - work
  - chat
  - en
  - zh
  - voice
